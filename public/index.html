<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Decode the Signal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #020a0f;
    --surface: #041420;
    --border: #0d4a6e;
    --accent: #00ffe7;
    --accent2: #ff6b35;
    --warn: #ffd700;
    --text: #c8e8f0;
    --dim: #4a7a8a;
    --glow: 0 0 20px rgba(0,255,231,0.4);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
  }
  body::before {
    content:''; position:fixed; inset:0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,231,0.015) 2px, rgba(0,255,231,0.015) 4px);
    pointer-events:none; z-index:999;
  }
  body::after {
    content:''; position:fixed; inset:0;
    background-image: linear-gradient(rgba(0,255,231,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,231,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events:none; z-index:0;
  }
  .container { position:relative; z-index:1; max-width:480px; margin:0 auto; padding:20px 16px; }

  .header { text-align:center; padding:20px 0 18px; border-bottom:1px solid var(--border); margin-bottom:24px; }
  .header .label { font-size:10px; letter-spacing:5px; color:var(--dim); text-transform:uppercase; margin-bottom:8px; }
  .header h1 { font-family:'Orbitron',sans-serif; font-size:clamp(22px,6vw,30px); font-weight:900; color:var(--accent); text-shadow:var(--glow); letter-spacing:2px; }
  .header h1 span { color:var(--accent2); }

  .timer-wrap { display:flex; justify-content:center; margin-bottom:18px; }
  .timer-ring { position:relative; width:88px; height:88px; }
  .timer-ring svg { transform:rotate(-90deg); width:88px; height:88px; }
  .track { fill:none; stroke:var(--border); stroke-width:5; }
  .prog  { fill:none; stroke:var(--accent); stroke-width:5; stroke-linecap:round; stroke-dasharray:251.2; stroke-dashoffset:0; transition:stroke-dashoffset 1s linear, stroke 0.3s; }
  .timer-inner { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .timer-inner .num { font-family:'Orbitron',sans-serif; font-size:26px; font-weight:700; color:var(--accent); text-shadow:var(--glow); line-height:1; }
  .timer-inner .sec { font-size:9px; color:var(--dim); letter-spacing:2px; }

  .status { display:flex; align-items:center; gap:6px; justify-content:center; margin-bottom:20px; font-size:11px; letter-spacing:2px; color:var(--accent); }
  .dot { width:7px; height:7px; background:var(--accent); border-radius:50%; animation:pulse 1s ease-in-out infinite; box-shadow:0 0 8px var(--accent); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .section-label { font-size:10px; letter-spacing:4px; color:var(--dim); text-transform:uppercase; margin-bottom:10px; display:flex; align-items:center; gap:8px; }
  .section-label::after { content:''; flex:1; height:1px; background:var(--border); }

  .wf-box { background:#010d14; border:1px solid var(--border); border-radius:8px; padding:14px 12px 10px; margin-bottom:18px; }
  canvas { display:block; width:100%; height:110px; }

  .rule-box { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px 16px; margin-bottom:20px; display:flex; gap:24px; flex-wrap:wrap; }
  .rule-item { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--text); }
  .swatch { width:30px; height:10px; border-radius:2px; }
  .sw-high { background:#2563eb; }
  .sw-low  { background:var(--border); }
  .rule-item strong { color:var(--accent); }

  .form-group { margin-bottom:14px; }
  .form-group label { font-size:10px; letter-spacing:3px; color:var(--dim); text-transform:uppercase; display:block; margin-bottom:6px; }
  .form-group input { width:100%; background:rgba(0,255,231,0.04); border:1px solid var(--border); border-radius:6px; padding:11px 14px; font-family:'Share Tech Mono',monospace; font-size:15px; color:var(--text); outline:none; transition:border-color 0.2s; -webkit-appearance:none; }
  .form-group input:focus { border-color:var(--accent); }
  .form-group input::placeholder { color:var(--dim); }
  .binary-input { font-size:22px !important; letter-spacing:8px; text-align:center; }
  .hint { font-size:11px; color:var(--dim); text-align:center; margin-top:5px; letter-spacing:1px; }

  .submit-btn { width:100%; background:rgba(0,255,231,0.08); border:1px solid var(--accent); border-radius:8px; padding:15px; font-family:'Orbitron',sans-serif; font-size:14px; font-weight:700; letter-spacing:3px; color:var(--accent); cursor:pointer; text-transform:uppercase; transition:all 0.2s; text-shadow:var(--glow); -webkit-tap-highlight-color:transparent; }
  .submit-btn:hover, .submit-btn:active { background:rgba(0,255,231,0.18); }
  .submit-btn:disabled { opacity:0.4; cursor:not-allowed; }

  .feedback { margin-top:14px; padding:12px 16px; border-radius:8px; font-size:13px; text-align:center; display:none; line-height:1.6; }
  .feedback.ok { display:block; background:rgba(57,255,20,0.08); border:1px solid rgba(57,255,20,0.4); color:#39ff14; }
  .feedback.no { display:block; background:rgba(255,70,70,0.08); border:1px solid rgba(255,70,70,0.4); color:#ff4646; }

  .lb-box { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:14px; margin-top:20px; }
  .lb-title { font-size:10px; letter-spacing:3px; color:var(--dim); text-transform:uppercase; margin-bottom:10px; }
  .lb-row { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid rgba(13,74,110,0.3); font-size:13px; animation:slideIn 0.3s ease; }
  .lb-row:last-child { border-bottom:none; }
  @keyframes slideIn { from{opacity:0;transform:translateX(-8px)} to{opacity:1;transform:translateX(0)} }
  .lb-medal { font-size:16px; width:22px; text-align:center; }
  .lb-name { flex:1; color:var(--text); }
  .lb-time { font-size:11px; color:var(--dim); }
  .lb-empty { font-size:12px; color:var(--dim); text-align:center; padding:8px; }

  .big-panel { display:none; text-align:center; padding:32px 16px; animation:fadeUp 0.5s ease; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .big-panel .icon { font-size:60px; margin-bottom:16px; }
  .big-panel h2 { font-family:'Orbitron',sans-serif; font-size:22px; color:var(--accent); text-shadow:var(--glow); margin-bottom:8px; }
  .big-panel .rank { font-size:14px; color:var(--warn); margin-bottom:8px; }
  .big-panel p { font-size:13px; color:var(--dim); }

  .footer { text-align:center; padding:20px 0; font-size:11px; color:var(--dim); letter-spacing:2px; border-top:1px solid var(--border); margin-top:16px; }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="label">// Live Challenge</div>
    <h1>DECODE THE <span>SIGNAL</span></h1>
  </div>

  <div class="timer-wrap">
    <div class="timer-ring">
      <svg viewBox="0 0 88 88">
        <circle class="track" cx="44" cy="44" r="40"/>
        <circle class="prog" id="arc" cx="44" cy="44" r="40"/>
      </svg>
      <div class="timer-inner">
        <span class="num" id="timerNum">60</span>
        <span class="sec">SEC</span>
      </div>
    </div>
  </div>

  <div class="status"><div class="dot"></div><span id="statusTxt">CHALLENGE ACTIVE</span></div>

  <div id="mainContent">

    <div class="section-label">NRZ WAVEFORM — 4 BITS</div>
    <div class="wf-box">
      <canvas id="wf"></canvas>
    </div>

    <div class="rule-box">
      <div class="rule-item"><div class="swatch sw-high"></div> High = <strong>1</strong></div>
      <div class="rule-item"><div class="swatch sw-low"></div> Low = <strong>0</strong></div>
    </div>

    <div class="section-label">YOUR ANSWER</div>

    <div class="form-group">
      <label>Your Name</label>
      <input type="text" id="nameIn" placeholder="your name " maxlength="40" autocomplete="off">
    </div>

    <div class="form-group">
      <label>4-Bit Binary String</label>
      <input type="text" id="ansIn" class="binary-input" placeholder="_ _ _ _" maxlength="4" autocomplete="off" spellcheck="false">
      <div class="hint">Example: 1111 &nbsp;or&nbsp; 0000</div>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="check()">▶ SUBMIT ANSWER</button>
    <div class="feedback" id="fb"></div>

    <div class="lb-box">
      <div class="lb-title">// Correct Answers</div>
      <div id="lbList"><div class="lb-empty">No correct answers yet — be first!</div></div>
    </div>

  </div>

  <div class="big-panel" id="successPanel">
    <div class="icon">🏆</div>
    <h2>SIGNAL DECODED!</h2>
    <div class="rank" id="rankTxt"></div>
    <p>CONGRATS.</p>
  </div>

  <div class="big-panel" id="expiredPanel">
    <div class="icon">⏱</div>
    <h2>TIME'S UP</h2>
    <p>Submission window closed.<br>SORRY!</p>
  </div>

  <div class="footer">NRZ ENCODING // INFO</div>
</div>

<script>
const BITS    = [1,0,1,1];
const ANSWER  = '1011';
const DURATION = 60;
const STORAGE_KEY = 'dtg_v2';

function drawWF(){
  const cvs = document.getElementById('wf');
  const W = cvs.offsetWidth || 400;
  cvs.width = W; cvs.height = 110;
  const ctx = cvs.getContext('2d');
  const bw = W / BITS.length;
  const HIGH = 15, LOW = 78;

  ctx.clearRect(0,0,W,110);
  ctx.fillStyle='#010d14'; ctx.fillRect(0,0,W,110);

  ctx.strokeStyle='rgba(13,74,110,0.5)'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
  for(let i=1;i<BITS.length;i++){ ctx.beginPath(); ctx.moveTo(i*bw,0); ctx.lineTo(i*bw,110); ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(0,46); ctx.lineTo(W,46); ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle='rgba(0,255,231,0.4)'; ctx.font='11px Share Tech Mono';
  ctx.fillText('+V', 4, HIGH+12);
  ctx.fillText('  0', 4, LOW+4);

  ctx.fillStyle='rgba(74,122,138,0.9)'; ctx.font='bold 13px Share Tech Mono';
  for(let i=0;i<BITS.length;i++) ctx.fillText('b'+(i+1), i*bw+bw/2-8, 106);

  ctx.strokeStyle='#2563eb'; ctx.lineWidth=3; ctx.lineJoin='round';
  ctx.shadowColor='#2563eb'; ctx.shadowBlur=6;
  ctx.beginPath();
  for(let i=0;i<BITS.length;i++){
    const x=i*bw, y=BITS[i]===1?HIGH:LOW;
    if(i===0){ ctx.moveTo(x,y); }
    else {
      const py=BITS[i-1]===1?HIGH:LOW;
      if(py!==y){ ctx.lineTo(x,py); ctx.lineTo(x,y); }
    }
    ctx.lineTo(x+bw,y);
  }
  ctx.stroke(); ctx.shadowBlur=0;
}

let timeLeft = DURATION;
const CIRC = 2*Math.PI*40;
const arcEl = document.getElementById('arc');
const numEl = document.getElementById('timerNum');

const ticker = setInterval(()=>{
  timeLeft--;
  numEl.textContent = timeLeft;
  arcEl.style.strokeDashoffset = CIRC*(1 - timeLeft/DURATION);
  if(timeLeft<=10){ arcEl.style.stroke='#ff6b35'; numEl.style.color='#ff6b35'; }
  if(timeLeft<=0){ clearInterval(ticker); expire(); }
}, 1000);

function expire(){
  if(document.getElementById('successPanel').style.display==='block') return;
  document.getElementById('mainContent').style.display='none';
  document.getElementById('expiredPanel').style.display='block';
  document.getElementById('statusTxt').textContent='TIME EXPIRED';
}

function getSubs(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]; }catch(e){ return []; } }
function saveSub(name, correct){
  const s=getSubs();
  s.push({ name, correct, time:Date.now(), timeStr:new Date().toLocaleTimeString('en-US',{hour12:false}) });
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
}

function renderLB(){
  const winners = getSubs().filter(s=>s.correct);
  const el = document.getElementById('lbList');
  if(!winners.length){ el.innerHTML='<div class="lb-empty">No correct answers yet — be first!</div>'; return; }
  const medals=['🥇','🥈','🥉'];
  el.innerHTML = winners.slice(0,3).map((w,i)=>`
    <div class="lb-row">
      <div class="lb-medal">${medals[i]||'✓'}</div>
      <div class="lb-name">${esc(w.name)}</div>
      <div class="lb-time">${w.timeStr}</div>
    </div>`).join('');
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function check(){
  if(timeLeft<=0) return;
  const name=document.getElementById('nameIn').value.trim();
  const ans=document.getElementById('ansIn').value.trim();
  const fb=document.getElementById('fb');
  if(!name){ document.getElementById('nameIn').style.borderColor='#ff4646'; setTimeout(()=>document.getElementById('nameIn').style.borderColor='',600); return; }
  if(!/^[01]{4}$/.test(ans)){ fb.className='feedback no'; fb.textContent='Please enter exactly 4 bits — only 0s and 1s.'; return; }

  const correct = ans===ANSWER;
  saveSub(name, correct);

  if(correct){
    clearInterval(ticker);
    const rank=getSubs().filter(s=>s.correct).length;
    document.getElementById('mainContent').style.display='none';
    document.getElementById('successPanel').style.display='block';
    document.getElementById('rankTxt').textContent=['🥇 First place!','🥈 Second place!','🥉 Third place!'][rank-1]||('#'+rank+' correct');
    document.getElementById('statusTxt').textContent='CORRECT!';
  } else {
    fb.className='feedback no';
    fb.textContent='Not quite — check the waveform carefully and try again.';
    document.getElementById('ansIn').value='';
    document.getElementById('ansIn').focus();
  }
  renderLB();
}

document.getElementById('ansIn').addEventListener('input', e=>{ e.target.value=e.target.value.replace(/[^01]/g,''); });
document.addEventListener('keydown', e=>{ if(e.key==='Enter') check(); });

drawWF();
renderLB();
window.addEventListener('resize', drawWF);
</script>
</body>
</html>
